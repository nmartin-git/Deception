services:
  mariadb:
    build: ./requirements/mariadb/
    image: mariadb
    container_name: c_mariadb
    env_file:
      - .env
      - ../secrets/mariadb_pwd
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always

  redis:
    build: ./requirements/bonus/redis/
    image: redis
    container_name: c_redis
    volumes:
      - redis_data:/var/lib/redis
    networks:
      - inception
    restart: always

  wordpress:
    build: ./requirements/wordpress/
    image: wordpress
    container_name: c_wordpress
    env_file:
      - .env
      - ../secrets/wordpress_pwd
      - ../secrets/mariadb_pwd
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
      - redis
    restart: always

  adminer:
    build: ./requirements/bonus/adminer/
    image: adminer
    container_name: c_adminer
    volumes:
      - adminer_data:/var/www/adminer
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always

  nginx:
    build: ./requirements/nginx/
    image: nginx
    container_name: c_nginx
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
      - adminer_data:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception
    depends_on:
      - wordpress
      - adminer
    restart: always

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmartin/data/mariadb

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmartin/data/redis

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmartin/data/wordpress

  adminer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/nmartin/data/adminer